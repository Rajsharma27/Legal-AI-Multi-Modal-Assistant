version: '3.8'

services:
  legal-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal_ai_backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - LLM_MODEL=gemini-2.5-flash
      - EMBEDDING_MODEL=models/text-embedding-004
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./data:/app/data
    restart: unless-stopped
